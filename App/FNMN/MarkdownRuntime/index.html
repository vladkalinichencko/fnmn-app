<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="katex.min.css">
<script src="markdown-it.min.js"></script>
<script src="markdown-it-footnote.min.js"></script>
<script src="katex.min.js"></script>
<style>
:root { color-scheme: light dark; }
body { margin: 20px; font: -apple-system-body; overflow-wrap: anywhere; }
img { max-width: 100%; height: auto; }
.katex-display { overflow-x: auto; overflow-y: hidden; }
.footnotes { font-size: .9em; }
</style>
</head>
<body>
<article id="content">Loading…</article>
<script>
function protectMath(source) {
  const slots = [];
  const hold = (display) => (_, body) => {
    slots.push({ display, body });
    return "@@MATH" + (slots.length - 1) + "@@";
  };
  let text = source.replace(/\$\$([\s\S]+?)\$\$/g, hold(true));
  text = text.replace(/\\\[([\s\S]+?)\\\]/g, hold(true));
  text = text.replace(/\\\(([\s\S]+?)\\\)/g, hold(false));
  text = text.replace(/\$([^$\n]+?)\$/g, hold(false));
  return { text, slots };
}

async function main() {
  const params = new URLSearchParams(location.search);
  const book = params.get("book");
  const contentFile = params.get("content") || "content.md";
  const assets = params.get("assets") || "assets";
  const heading = params.get("heading");
  const article = document.getElementById("content");
  if (!book) {
    article.textContent = "Missing book.";
    return;
  }
  const encoded = encodeURI(book);
  let markdown;
  try {
    const response = await fetch("../books/" + encoded + "/" + encodeURI(contentFile));
    if (!response.ok) throw new Error(response.statusText);
    markdown = await response.text();
  } catch (error) {
    article.textContent = "Couldn’t load the book.";
    return;
  }
  const { text, slots } = protectMath(markdown);
  const html = window.markdownit({ html: false }).use(window.markdownitFootnote).render(text)
    .replace(/@@MATH(\d+)@@/g, (_, index) => {
      const slot = slots[Number(index)];
      try {
        return katex.renderToString(slot.body, { displayMode: slot.display, throwOnError: false });
      } catch (error) {
        return "<code>" + slot.body + "</code>";
      }
    });
  article.innerHTML = html;
  Array.from(article.children).filter(function (node) {
    return /^H[1-6]$/.test(node.tagName);
  }).forEach(function (node, index) {
    node.id = "toc-" + (index + 1);
  });
  article.querySelectorAll("img").forEach((image) => {
    const src = image.getAttribute("src") || "";
    if (src.indexOf(assets + "/") === 0) image.src = "../books/" + encoded + "/" + src;
  });
  if (heading) {
    const target = document.getElementById("toc-" + heading);
    if (target) target.scrollIntoView();
  }
}
main();
</script>
</body>
</html>
