# Runs only the hot-path guard; the repository's style baseline is not enforced here.
only_rules:
  - snapshot_catalog_selector_in_view

excluded:
  - .build
  - "**/.build/**"
  - Vendor
  - App/FNMN/Store/LibraryModel.swift
  - Tests/FNMNCoreTests/HotPathGuardTests.swift

custom_rules:
  snapshot_catalog_selector_in_view:
    name: "Catalog rebuild in a view body"
    regex: "snapshot\\.(items\\(|albumSummaries|unsortedItems|continueItems|groups\\(|groupName\\(|archivedItems|annotationGroups)"
    message: "Read LibraryModel's collected list (library.items(...), library.albumSummaries(), ...) — these snapshot selectors rebuild the whole catalog, ~10 ms per 1500 materials, in a view body."
    severity: error
